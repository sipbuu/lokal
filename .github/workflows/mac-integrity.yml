name: macOS package integrity

on:
  pull_request:
    paths:
      - 'electron/**'
      - 'native/**'
      - 'build/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Electron before concurrent test workers
        run: node node_modules/electron/install.js
      - run: npm run rebuild:web
      - name: Download identity and durable video integration
        timeout-minutes: 5
        run: node --test scripts/download-library-sync.test.mjs scripts/library-duplicates.test.mjs scripts/download-upgrade.test.mjs scripts/download-args.test.mjs scripts/download-adapters.test.mjs scripts/discovery-video-ui.test.mjs scripts/music-video.test.mjs scripts/music-video-downloads.test.mjs scripts/music-video-integration.test.mjs scripts/music-video-identity.test.mjs scripts/music-video-queue.test.mjs scripts/music-video-playback.test.mjs scripts/mac-updates.test.mjs
      - name: YouTube account, session and login adapters
        timeout-minutes: 5
        run: node --test scripts/youtube-account.test.mjs scripts/youtube-session.test.mjs scripts/youtube-embedded-login.test.mjs scripts/youtube-browser.test.mjs scripts/youtube-stream.test.mjs
      - name: Native playback and renderer audio adapters
        timeout-minutes: 5
        run: node --test scripts/native-output.test.mjs scripts/audio-output.test.mjs scripts/player-audio.test.mjs scripts/crossfade.test.mjs scripts/music-video-playback.test.mjs
      - run: npm run build -- --publish never --mac dmg zip --${{ matrix.arch }} --config.mac.identity=- --config.mac.notarize=false
        env:
          CSC_FOR_PULL_REQUEST: 'true'
      - run: npm run verify:mac-package -- release ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: mac-integrity-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
