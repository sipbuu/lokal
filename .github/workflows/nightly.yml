name: Build Lokal Nightly

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git Ref/Tag/Commit to build'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  version:
    # Works out the nightly version once and pins the commit, so the three
    # build runners (and the release) use the same version from the same tag
    # snapshot, even if main or the tags move while they run.
    name: Work out the nightly version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      sha: ${{ steps.calc.outputs.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Calculate the nightly version
        id: calc
        env:
          # Through the environment, not pasted into the script: a ref is user input.
          REF: ${{ inputs.ref || 'main' }}
        # Build as e.g. 2.0.3-nightly.42 rather than plain 2.0.3: a pre-release
        # version counts as *older* than the release it leads up to, so people
        # on a nightly are still offered the official 2.0.3 by the updater once
        # it's out.
        # If that version is already released (its tag exists), the nightly is
        # a pre-release of the *next* patch: after v2.0.3 is tagged, main's
        # 2.0.3 builds as 2.0.4-nightly.N, so it stays newer than the release
        # without anyone having to bump package.json after each release.
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          # Must succeed: without the latest tags, the version and nightly
          # number below would be worked out from stale ones.
          git fetch --tags --force --quiet origin
          if git rev-parse -q --verify "refs/tags/v${BASE}" >/dev/null; then
            BASE=$(node -p "const [a, b, c] = process.argv[1].split('.').map(Number); [a, b, c + 1].join('.')" "$BASE")
            echo "v$(node -p "require('./package.json').version") is already released; building the next patch."
          fi
          # The nightly number starts again after each release: it's how many
          # changes (merges/commits on the first-parent line) have landed since
          # the last release tag, so after v2.0.3 the builds go 2.0.4-nightly.1,
          # .2, ... It only goes up as main moves forward, and it comes from git
          # alone. With no release tag at all, fall back to the workflow run
          # number. The tag is looked up along the
          # first-parent line too, so a tag inside a merged branch doesn't count.
          LAST=$(git describe --first-parent --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD 2>/dev/null) || LAST=""
          if [ -n "$LAST" ]; then
            N=$(git rev-list --count --first-parent "${LAST}..HEAD")
            if [ "$N" -eq 0 ]; then
              # This commit IS the release: a nightly of it would only be a
              # "nightly.0" copy of that release under another version.
              echo "::error::Nothing has changed since ${LAST}; there is no nightly to build. Merge a change first, or build another ref."
              exit 1
            fi
            echo "${N} change(s) since ${LAST}."
          else
            N=${{ github.run_number }}
            echo "No release tag found; using the run number."
          fi
          VERSION="${BASE}-nightly.${N}"
          echo "Nightly version: ${VERSION}"
          # The release's tag is the version itself (v2.1.2-nightly.3): GitHub
          # orders same-day releases by the version in the tag name, and a
          # plain "nightly-main" tag sorted below that day's stable release.
          # A build of another ref gets it appended (v2.1.2-nightly.3.my-branch).
          if [ "$REF" = "main" ]; then
            TAG="v${VERSION}"
          else
            TAG="v${VERSION}.$(printf '%s' "$REF" | tr -c '0-9A-Za-z-' '-' | sed 's/^-*//; s/-*$//' | cut -c1-40)"
          fi
          echo "Nightly tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: version
    strategy:
      matrix:
        # Linux stays on a fixed, older Ubuntu: native modules compiled here
        # only run on systems at least this new, so a newer image would
        # lock older distros out of the AppImage/deb.
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          # The commit the version was worked out from, not wherever the ref
          # points now.
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust (for Windows SMTC bridge)
        # Must run before "Install Dependencies": this repo's postinstall
        # script (electron-builder install-app-deps && npm run
        # native:prepare) invokes `cargo build` for the SMTC bridge addon
        # as part of `npm install` itself, so cargo has to already be on
        # PATH by then, not just before a later separate build step.
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dependencies
        run: npm install

      - name: Mark this build as a nightly version
        # The version was worked out once, in the "version" job, so every
        # runner builds the same one. Only this build's copy of package.json
        # is changed; nothing is committed.
        shell: bash
        run: |
          npm pkg set version="${{ needs.version.outputs.version }}"
          echo "Building nightly version $(node -p "require('./package.json').version")"

      - name: Build Application
        run: npm run build -- --publish never

      - name: Rename release files for this runner
        shell: bash
        run: |
          cd release 2>/dev/null || exit 0
          
          shopt -s nullglob
          
          for f in *\ *; do
            if [ -f "$f" ]; then
              mv "$f" "${f// /-}"
            fi
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.os }}
          path: release

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          # The commit the version was worked out from, not wherever the ref
          # points now.
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # Banner generation is optional and must not block publishing artifacts.
      - name: Install Playwright
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/lokal-banner" --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/lokal-banner/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Get Last Commit Info
        id: commit_info
        shell: bash
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_DATE=$(git log -1 --format="%cd" --date=format:'%Y-%m-%d %H:%M:%S UTC')
          
          echo "MSG=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "DATE=$COMMIT_DATE" >> $GITHUB_OUTPUT
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Generate Nightly Banner
        id: banner
        env:
          NODE_PATH: ${{ runner.temp }}/lokal-banner/node_modules
          # Passed through the environment and read via process.env below
          # instead of interpolated straight into the JS source -- inputs.ref
          # is a write-authorized but still user-controlled string, and a ref
          # containing quote/statement syntax would otherwise land in this
          # heredoc as executable code (CWE-94) rather than as data.
          NIGHTLY_REF: ${{ inputs.ref || 'main' }}
          NIGHTLY_TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Drawn from this repo (.github/banner): the outside page it used to
          # be taken from stopped answering. Never fails the job.
          # (A build of an older commit doesn't have the drawing: no banner then.)
          if [ -f .github/banner/render.js ]; then
            BANNER_VERSION="$NIGHTLY_TAG" BANNER_TYPE=nightly BANNER_REF="$NIGHTLY_REF" node .github/banner/render.js
          fi
          # The release is re-created each run (see below), so only link a
          # banner this run actually made.
          if [ -f release-banner.png ]; then
            echo "md=![Release Banner](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/release-banner.png)" >> "$GITHUB_OUTPUT"
          else
            echo "md=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Aggregate artifacts into release_all
        shell: bash
        run: |
          mkdir -p release_all
          shopt -s nullglob
          for d in artifacts/*; do
            if [ -d "$d" ]; then
              cp -R "$d"/* release_all/ || true
            fi
          done
          if [ -z "$(ls -A release_all 2>/dev/null)" ]; then
            mkdir -p release_all
            touch release_all/.no_files
          fi

      - name: Generate checksums for all artifacts
        id: checksums
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            SHACMD='sha256sum'
          else
            SHACMD='shasum -a 256'
          fi

          echo "HASHES<<EOF" >> $GITHUB_OUTPUT
          for f in release_all/*; do
            if [ -f "$f" ] && [ "$(basename "$f")" != ".no_files" ]; then
              HASH=$($SHACMD "$f" | awk '{print toupper($1)}')
              NAME=$(basename "$f")
              echo "> **$NAME**: \`[$HASH]\`" >> $GITHUB_OUTPUT
            fi
          done
          if [ -z "$(ls -A release_all 2>/dev/null | grep -v .no_files)" ]; then
            echo "No release files found" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Remove the previous nightly
        # Only one nightly per ref is kept: the previous one (release and tag)
        # goes, whether it has the old "nightly-<ref>" tag or a versioned one
        # (v2.1.2-nightly.2 for main, v2.1.2-nightly.2.<ref> for another ref).
        # Stable releases are never touched: only pre-releases with a
        # "-nightly." tag of this ref. (Releases made with the workflow token
        # don't trigger other workflows, so the v* tag doesn't start a stable
        # release build and nothing is announced on Discord.)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref || 'main' }}
          NEW_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          SUFFIX=""
          if [ "$REF" != "main" ]; then SUFFIX="\.${NEW_TAG##*-nightly.[0-9]*.}"; fi
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
          while read -r tag; do
            if [ "$tag" = "nightly-$REF" ] || [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+${SUFFIX}$ ]]; then
              [ "$tag" = "$NEW_TAG" ] && continue
              echo "Removing the previous nightly: $tag"
              gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes || true
            fi
          done

      - name: Create Nightly Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ steps.commit_info.outputs.SHA }}
          name: "Lokal Nightly (${{ inputs.ref || 'main' }})"
          prerelease: true
          files: |
            release_all/**/*.exe
            release_all/**/*.dmg
            release_all/**/*.AppImage
            release_all/**/*.deb
            release_all/**/*.zip
            release_all/**/latest*.yml
            release-banner.png
          body: |
            ${{ steps.banner.outputs.md }}

            ---
            
            *This is a nightly build, code may/may not be fully functional.*
            Last commit note/date: `${{ steps.commit_info.outputs.MSG }}` at `${{ steps.commit_info.outputs.DATE }}`

            ---

            FYI:
            **Lokal is 100% local; the library, history, anything in database, or any info that is used for API's such as yt-dlp, LRCLIB, is *NOT* seen by us.**

            ---

            ## Setup

            See [README.md](./README.md) for full setup instructions.

            ---

            ### Binary Checksums (SHA-256)

            ${{ steps.checksums.outputs.HASHES }}

      - name: Remove older nightly files
        # Nightly file names carry the build number (2.0.3-nightly.84), so a new
        # run no longer overwrites the previous one's files. Once this run's
        # files are up, delete every other file on the nightly release, so it
        # always holds exactly one build (and never none, since this runs after
        # the upload).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          # The banner is always kept: when this run couldn't make one, the
          # previous banner stays rather than leaving a broken image. (Written
          # for the runner's `bash -e -o pipefail`: a bare `[ -f ... ] && ...`
          # for the banner returned 1 and stopped the whole step.)
          keep=$( { find release_all -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' -o -name 'latest*.yml' \) -printf '%f\n'; echo release-banner.png; } | sort -u )
          if [ "$keep" = "release-banner.png" ]; then
            echo "No files from this run; leaving the release as it is."
            exit 0
          fi
          gh api "repos/${{ github.repository }}/releases/tags/$NIGHTLY_TAG" --jq '.assets[] | "\(.id)\t\(.name)"' |
          while IFS=$'\t' read -r id name; do
            if ! grep -qxF -- "$name" <<< "$keep"; then
              echo "Deleting older nightly file: $name"
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
            fi
          done
      - name: Discord Notification (Build Complete)
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # DISCORD_WEBHOOK lives in the upstream repo's secrets, not every
          # fork's -- an empty/unset secret makes curl's URL argument empty,
          # which curl rejects outright ("URL rejected: Malformed input to a
          # URL function", exit 3). By this point the actual release has
          # already been created above, so a missing or unreachable webhook
          # is a cosmetic notification failing, not a real problem -- don't
          # let it fail the job.
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set on this repo -- skipping Discord notification."
            exit 0
          fi

          BANNER_URL="https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/release-banner.png"

          PAYLOAD=$(jq -n \
            --arg version "Nightly (${{ inputs.ref || 'main' }})" \
            --arg url "${{ steps.create_release.outputs.html_url }}" \
            --arg msg "${{ steps.commit_info.outputs.MSG }}" \
            --arg image "$BANNER_URL" \
            --arg footer_icon "https://i.imgur.com/ZC3mEUC.png" \
            --argjson color 15105570 \
            '{
              embeds: [{
                title: "Build Complete: Nightly Lokal \($version)",
                description: "All platform binaries for **\($version)** have been successfully built and uploaded to the nightly pre-release.\n\n**Status:** Nightly Ready\n**Last Commit:** \($msg)",
                url: $url,
                color: $color,
                image: { url: $image },
                footer: { text: "Lokal Build System", icon_url: $footer_icon }
              }]
            }'
          )

          curl -sS -f --max-time 15 -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK" \
            || echo "Discord webhook call failed (rejected or unreachable) -- not fatal, release already published above."
