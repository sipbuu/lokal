name: Release Lokal

on:
  push:
    tags:
      - 'v*'
    # A merged version bump (package.json changed to a version that has no
    # tag yet) is tagged and built: see "prepare".
    branches:
      - main
    paths:
      - package.json
  # Actions > Release Lokal > Run workflow: opens the "Version X.Y.Z" PR
  # (package.json, package-lock.json, the README badge). Merging it releases
  # that version. If package.json already has a version that isn't tagged
  # yet, Run workflow tags and builds it straight away. Pushing a vX.Y.Z tag
  # yourself still works as before.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (from the version in package.json)'
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Or an exact version, e.g. 5.3.0 (overrides the bump)'
        required: false
        default: ''

# One release at a time.
concurrency:
  group: release-lokal
  cancel-in-progress: false

jobs:
  prepare:
    # Run workflow, or a push to main touching package.json. A pushed tag
    # skips this: it is the release already.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    name: Version PR or tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          # Through the environment, not pasted into the script: user input.
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          LAST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          untagged() { ! git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }

          if [ "$EVENT" = "push" ]; then
            # A merged bump: release it if that version has no tag yet.
            if [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && untagged "$CURRENT"; then
              echo "package.json says $CURRENT, not tagged yet: releasing it."
              echo "mode=tag" >> "$GITHUB_OUTPUT"; echo "new=$CURRENT" >> "$GITHUB_OUTPUT"
            else
              echo "package.json says $CURRENT, already released: nothing to do."
              echo "mode=none" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ -n "$EXACT" ]; then
            NEW="${EXACT#v}"
          else
            NEW=$(node -e '
              const [a, b, c] = process.argv[1].split("-")[0].split(".").map(Number)
              const bump = process.argv[2]
              console.log(bump === "major" ? `${a + 1}.0.0` : bump === "minor" ? `${a}.${b + 1}.0` : `${a}.${b}.${c + 1}`)
            ' "$CURRENT" "$BUMP")
            # package.json already ahead of the last release (a bump merged,
            # never tagged): release that rather than skipping a version.
            if untagged "$CURRENT"; then NEW="$CURRENT"; fi
          fi
          if ! [[ "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Version::\"$NEW\" isn't a version like 5.3.0."; exit 1
          fi
          if ! untagged "$NEW"; then
            echo "::error title=Version::v$NEW already exists. Pick another version (or delete that tag first to release it again)."; exit 1
          fi
          # Never go backwards: the updater would not offer it.
          if [ "$NEW" != "$CURRENT" ] && [ "$(printf '%s\n%s\n' "$CURRENT" "$NEW" | sort -V | tail -1)" != "$NEW" ]; then
            echo "::error title=Version::$NEW is older than the current $CURRENT."; exit 1
          fi
          if [ -n "$LAST" ] && [ "$(git rev-list --count "$LAST..HEAD")" = "0" ]; then
            echo "::error title=Nothing to release::main has nothing new since $LAST."; exit 1
          fi
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$CURRENT" ]; then
            echo "package.json already says $NEW: tagging and building it."
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            echo "Opening the PR for $CURRENT -> $NEW (previous release: ${LAST:-none})."
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump package.json, package-lock.json and the README badge
        if: steps.version.outputs.mode == 'pr'
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEW: ${{ steps.version.outputs.new }}
        run: |
          # Text replacements, not a JSON rewrite: the diff stays four lines.
          node -e '
            const fs = require("fs")
            const [cur, next] = process.argv.slice(1)
            const swap = (file, times) => {
              let s = fs.readFileSync(file, "utf8"), n = 0
              s = s.replace(new RegExp(`"version": "${cur.replace(/\./g, "\\.")}"`, "g"), m => n++ < times ? `"version": "${next}"` : m)
              if (!n) throw new Error(`${file}: version ${cur} not found`)
              fs.writeFileSync(file, s)
            }
            swap("package.json", 1)
            swap("package-lock.json", 2)  // the lock file itself, and packages[""]
          ' "$CURRENT" "$NEW"
          sed -i -E "s/version-[0-9]+\.[0-9]+\.[0-9]+-blue/version-$NEW-blue/" README.md
          git diff --stat
          git switch -q -c "release/v$NEW"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "Version $NEW"
          git push -f origin "release/v$NEW"

      - name: Open the version PR
        if: steps.version.outputs.mode == 'pr'
        uses: actions/github-script@v8
        env:
          NEW: ${{ steps.version.outputs.new }}
        with:
          # main takes changes only through a reviewed PR: this opens it, and
          # merging it (by a person) starts the release.
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo
            const { NEW } = process.env
            const branch = `release/v${NEW}`
            // A run before may have opened it already.
            let [pr] = (await github.rest.pulls.list({ owner, repo, state: 'open', base: 'main', head: `${owner}:${branch}` })).data
            if (!pr) {
              try {
                ({ data: pr } = await github.rest.pulls.create({
                  owner, repo, head: branch, base: 'main', title: `Version ${NEW}`,
                  body: `Bumps package.json, package-lock.json and the README badge to ${NEW}.\n\n**Merging this releases v${NEW}**: Release Lokal tags it and builds the draft release.`,
                }))
              } catch (err) {
                // Actions may not be allowed to open PRs here: the branch is
                // pushed, so hand over a link that opens it, title filled in.
                const url = `${context.serverUrl}/${owner}/${repo}/compare/main...${branch}?expand=1&title=${encodeURIComponent(`Version ${NEW}`)}`
                core.notice(`Open the PR: ${url} then merge it to release v${NEW}. (Actions couldn't open it: ${err.message})`, { title: 'Open the version PR' })
                await core.summary.addRaw(`### Open the version PR\n\n**[Open the "Version ${NEW}" PR](${url})**, then merge it to release **v${NEW}**: this workflow then tags and builds it.\n\n<sub>Actions couldn't open it (${err.message}). Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests" lets it next time.</sub>\n`).write()
                return
              }
            }
            core.notice(`Merge ${pr.html_url} to release v${NEW}.`, { title: 'Version PR ready' })
            await core.summary.addRaw(`### Version PR ready\n\nMerge [${pr.title} (#${pr.number})](${pr.html_url}) to release **v${NEW}**: this workflow then tags and builds it.\n`).write()

      - name: Tag the release
        id: tag
        if: steps.version.outputs.mode == 'tag'
        uses: actions/github-script@v8
        env:
          NEW: ${{ steps.version.outputs.new }}
        with:
          # The default token on purpose: a tag it makes doesn't start this
          # workflow a second time (the jobs below build it).
          github-token: ${{ github.token }}
          script: |
            const { execSync } = require('child_process')
            const tag = `v${process.env.NEW}`
            const sha = execSync('git rev-parse HEAD').toString().trim()
            await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `refs/tags/${tag}`, sha })
            core.info(`Tagged ${tag} at ${sha}`)
            core.setOutput('tag', tag)

  build:
    needs: prepare
    # Runs for a pushed tag (prepare skipped) or a tag prepare just made.
    if: ${{ !cancelled() && ((needs.prepare.result == 'skipped' && startsWith(github.ref, 'refs/tags/')) || (needs.prepare.result == 'success' && needs.prepare.outputs.tag != '')) }}
    strategy:
      matrix:
        # Linux stays on a fixed, older Ubuntu: native modules compiled here
        # only run on systems at least this new, so a newer image would
        # lock older distros out of the AppImage/deb.
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust (for Windows SMTC bridge)
        # Must run before "Install Dependencies": this repo's postinstall
        # script (electron-builder install-app-deps && npm run
        # native:prepare) invokes `cargo build` for the SMTC bridge addon
        # as part of `npm install` itself, so cargo has to already be on
        # PATH by then, not just before a later separate build step.
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build -- --publish never

      - name: Rename release files for this runner
        shell: bash
        run: |
          cd release 2>/dev/null || exit 0
          
          shopt -s nullglob
          
          for f in *\ *; do
            if [ -f "$f" ]; then
              mv "$f" "${f// /-}"
            fi
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.os }}
          path: release

  release:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # The version tag: pushed, or made by prepare.
      TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # Banner generation is optional and must not block publishing artifacts.
      - name: Install Playwright
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/lokal-banner" --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/lokal-banner/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Generate Release Banner
        id: banner
        env:
          NODE_PATH: ${{ runner.temp }}/lokal-banner/node_modules
          # Read via process.env rather than interpolated into the JS source.
          RELEASE_TAG: ${{ env.TAG }}
        run: |
          # Drawn from this repo (.github/banner): the outside page it used to
          # be taken from stopped answering. Never fails the job.
          # (A build of an older commit doesn't have the drawing: no banner then.)
          if [ -f .github/banner/render.js ]; then
            BANNER_VERSION="$RELEASE_TAG" BANNER_TYPE=release node .github/banner/render.js
          fi
          # The release starts as a draft, and GitHub doesn't serve a draft's
          # files: a link to its own release-banner.png showed as a broken
          # image in the draft and in the Discord message sent now (the
          # nightly, published at once, never had the problem). So the banner
          # is also committed to the "release-banners" branch, and linked
          # from there by commit (an address that works at once and never
          # changes). The release keeps its copy of the file too.
          URL=""
          if [ -f release-banner.png ]; then
            URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/release-banner.png"
            (
              set -e
              export GIT_INDEX_FILE="$RUNNER_TEMP/banner-index"
              rm -f "$GIT_INDEX_FILE"
              PARENT=""
              if git fetch --quiet --depth=1 origin refs/heads/release-banners 2>/dev/null; then
                PARENT=$(git rev-parse FETCH_HEAD)
                git read-tree "$PARENT"
              fi
              BLOB=$(git hash-object -w release-banner.png)
              git update-index --add --cacheinfo "100644,$BLOB,$RELEASE_TAG.png"
              TREE=$(git write-tree)
              COMMIT=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit-tree "$TREE" ${PARENT:+-p "$PARENT"} -m "Banner for $RELEASE_TAG")
              git push --quiet origin "$COMMIT:refs/heads/release-banners"
              echo "https://raw.githubusercontent.com/${{ github.repository }}/$COMMIT/$RELEASE_TAG.png" > "$RUNNER_TEMP/banner-url"
            ) && URL=$(cat "$RUNNER_TEMP/banner-url") \
              || echo "::warning title=Release banner::Couldn't save the banner to the release-banners branch: the draft and Discord will link the release's own copy, which shows once the release is published."
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # Only reference the banner in the release body when it exists, so
          # a skipped banner doesn't leave a broken image at the top.
          if [ -n "$URL" ]; then
            echo "md=![Release Banner]($URL)" >> "$GITHUB_OUTPUT"
          else
            echo "md=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Aggregate artifacts into release_all
        shell: bash
        run: |
          mkdir -p release_all
          shopt -s nullglob
          for d in artifacts/*; do
            if [ -d "$d" ]; then
              cp -R "$d"/* release_all/ || true
            fi
          done
          if [ -z "$(ls -A release_all 2>/dev/null)" ]; then
            mkdir -p release_all
            touch release_all/.no_files
          fi

      - name: Generate checksums for all artifacts
        id: checksums
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            SHACMD='sha256sum'
          else
            SHACMD='shasum -a 256'
          fi

          echo "HASHES<<EOF" >> $GITHUB_OUTPUT
          for f in release_all/*; do
            if [ -f "$f" ] && [ "$(basename "$f")" != ".no_files" ]; then
              HASH=$($SHACMD "$f" | awk '{print toupper($1)}')
              NAME=$(basename "$f")
              echo "> **$NAME**: \`[$HASH]\`" >> $GITHUB_OUTPUT
            fi
          done
          if [ -z "$(ls -A release_all 2>/dev/null | grep -v .no_files)" ]; then
            echo "No release files found" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get latest commit message (single)
        id: latest_commit
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "LATEST<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release_notes
        uses: actions/github-script@v8
        with:
          script: |
            // What changed since the previous official version: the highest
            // vX.Y.Z tag below this one. Nightly tags (v3.2.1-nightly.11) and
            // other pre-release tags are skipped, and so is "latest release",
            // which GitHub would otherwise use and which misses a version
            // that was published late or left as a draft.
            const { execSync } = require('child_process');
            const sh = (cmd) => execSync(cmd).toString();
            const tag = process.env.TAG;
            const parts = (t) => t.replace(/^v/, '').split(/[.-]/).map(n => parseInt(n, 10)).filter(n => !Number.isNaN(n));
            const below = (a, b) => {
              const x = parts(a), y = parts(b);
              for (let i = 0; i < Math.max(x.length, y.length); i++) {
                if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0);
              }
              return false;
            };
            const previous = sh("git tag --list 'v*'").split('\n')
              .map(t => t.trim())
              .filter(t => /^v\d+(\.\d+)*$/.test(t) && below(t, tag))
              .sort((a, b) => (below(a, b) ? 1 : -1))[0];
            core.info(`Release notes for ${tag}, since ${previous || 'the first commit'}`);
            const { owner, repo } = context.repo;

            // One entry per PR merged since then (oldest first), with its
            // description folded under it, ready to be tidied in the draft.
            // Version bump PRs and the bump commit itself are left out.
            const notes = async () => {
              if (!previous) throw new Error('no previous version');
              const lines = sh(`git log --first-parent --reverse --format=%H%x09%s ${previous}..${tag}`)
                .split('\n').filter(Boolean).map(l => l.split('\t'));
              const entries = [];
              const contributors = new Set();
              for (const [sha, subject] of lines) {
                const m = subject.match(/^Merge pull request #(\d+)/) || subject.match(/\(#(\d+)\)$/);
                if (!m) {
                  if (!/^Version \d+\.\d+\.\d+$/.test(subject)) entries.push(`- ${subject} (${sha.slice(0, 7)})`);
                  continue;
                }
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(m[1]) });
                if (/^(chore\/)?version-/.test(pr.head.ref) || /^Version \d+\.\d+\.\d+$/.test(pr.title)) continue;
                contributors.add(pr.user.login);
                const body = (pr.body || '')
                  .split('\n')
                  .filter(l => !/Generated with \[Claude Code\]|claude\.ai\/code\/session_|^Co-Authored-By:/i.test(l))
                  .join('\n').trim();
                entries.push(`- **${pr.title}** ([#${pr.number}](${pr.html_url}))` +
                  (body ? `\n  <details><summary>Details</summary>\n\n${body.replace(/^/gm, '  ')}\n\n  </details>` : ''));
              }
              if (!entries.length) throw new Error('no changes found');
              return [
                "## What's Changed",
                '',
                ...entries,
                '',
                contributors.size ? `Contributors: ${[...contributors].map(u => '@' + u).join(', ')}` : '',
                '',
                `**Full Changelog**: https://github.com/${owner}/${repo}/compare/${previous}...${tag}`,
              ].join('\n');
            };

            let body;
            try {
              body = await notes();
            } catch (err) {
              // Fall back to GitHub's own list of PR titles.
              core.warning(`Writing release notes from the PRs failed (${err.message}); using GitHub's.`);
              const response = await github.rest.repos.generateReleaseNotes({
                owner, repo,
                tag_name: tag,
                ...(previous ? { previous_tag_name: previous } : {}),
              });
              body = response.data.body;
            }
            core.setOutput('body', body);

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          files: |
            release_all/**/*.exe
            release_all/**/*.dmg
            release_all/**/*.AppImage
            release_all/**/*.deb
            release_all/**/*.zip
            release_all/**/latest*.yml
            release-banner.png
          draft: true
          body: |
            ${{ steps.banner.outputs.md }}

            ${{ steps.latest_commit.outputs.LATEST }}

            ---

            ## Changelog

            Windows builds: free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/) ([code signing policy](https://github.com/${{ github.repository }}#code-signing-policy)).

            FYI:
            **Lokal is 100% local; the library, history, anything in database, or any info that is used for API's such as yt-dlp, LRCLIB, is *NOT* seen by us.**

            ${{ steps.release_notes.outputs.body }}

            ---

            ## Setup

            See [README.md](./README.md) for full setup instructions.

            ---

            ### Binary Checksums (SHA-256)

            ${{ steps.checksums.outputs.HASHES }}

      - name: Discord Notification (Build Complete)
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          LATEST_MSG="${{ steps.latest_commit.outputs.LATEST }}"
          BANNER_URL="${{ steps.banner.outputs.url }}"
          BANNER_URL="${BANNER_URL:-https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/release-banner.png}"
          
          PAYLOAD=$(jq -n \
            --arg version "${{ env.TAG }}" \
            --arg url "${{ steps.create_release.outputs.html_url }}" \
            --arg msg "$LATEST_MSG" \
            --arg image "$BANNER_URL" \
            --arg footer_icon "https://i.imgur.com/ZC3mEUC.png" \
            --argjson color 3447003 \
            '{
              embeds: [{
                title: "Build Complete: Lokal \($version)",
                description: "All platform binaries for version **\($version)** have been successfully built and uploaded to the release draft. \n\n**Status:** Draft Ready\n**Last Commit:** \($msg)",
                url: $url,
                color: $color,
                image: { url: $image },
                footer: { text: "Lokal Build System", icon_url: $footer_icon }
              }]
            }'
          )

          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
